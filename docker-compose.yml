version: '3.8'

services:
  # ============================================================================
  # MongoDB Multi-Tenant Database
  # ============================================================================
  mongodb:
    image: mongo:6.0
    container_name: psypro_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secure_psypro_password}
      MONGO_INITDB_DATABASE: ${DB_DATABASE:-psypro_saas_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - psypro_net

  # ============================================================================
  # Backend API (Laravel 11 / PHP 8.2+)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psypro_backend
    restart: always
    environment:
      APP_NAME: PsyPro
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:6b3X2X7P7N0Z6C8A4K1F9G2H5J8L0Q3W=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mongodb
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_DATABASE: ${DB_DATABASE:-psypro_saas_db}
      DB_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      DB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secure_psypro_password}
      AI_SERVICE_URL: http://ai-service:8000
    volumes:
      - ./backend/storage:/var/www/html/storage
    depends_on:
      - mongodb
    networks:
      - psypro_net
      - dokploy-network

  # ============================================================================
  # AI Clinical Engine (FastAPI / Python)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: psypro_ai_service
    restart: always
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
    networks:
      - psypro_net
      - dokploy-network

  # ============================================================================
  # Frontend Application (React + Vite PWA / Tablet)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psypro_frontend
    restart: always
    depends_on:
      - backend
      - ai-service
    networks:
      - psypro_net
      - dokploy-network

networks:
  psypro_net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mongo_data:
    name: psypro_mongo_data
