services:
  mysql:
    image: mysql:8.0
    container_name: clinic_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: clinic_saas_db
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_secure_password123
      MYSQL_ROOT_PASSWORD: root_secure_password123
    ports:
      -  127.0.0.1:3306:3306
    volumes:
      - clinic_mysql_data:/var/lib/mysql
    networks:
      - clinic_network

  redis:
    image: redis:alpine
    container_name: clinic_redis
    restart: unless-stopped
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - clinic_redis_data:/data
    networks:
      - clinic_network

volumes:
  clinic_mysql_data:
    driver: local
  clinic_redis_data:
    driver: local

networks:
  clinic_network:
    driver: bridge
