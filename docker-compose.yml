version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: clinic_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - clinic_net

  # 2. Laravel Backend API
  backend:
    build:
      context: ./backend
    container_name: clinic_backend
    restart: always
    environment:
      DB_CONNECTION: mongodb
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_DATABASE: clinic_saas_db
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    networks:
      - clinic_net

  # 3. AI Service (FastAPI)
  ai-service:
    build:
      context: ./ai-service
    container_name: clinic_ai_service
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ./ai-service:/app
    networks:
      - clinic_net

networks:
  clinic_net:
    driver: bridge

volumes:
  mongo_data:
